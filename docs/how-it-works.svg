<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <g id="slideA">
      <rect width="168" height="100" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="12" y="12" width="90" height="10" rx="2" fill="#2563eb"/>
      <circle cx="16" cy="38" r="3" fill="#64748b"/><rect x="24" y="35" width="110" height="5" rx="2" fill="#94a3b8"/>
      <circle cx="16" cy="53" r="3" fill="#64748b"/><rect x="24" y="50" width="90" height="5" rx="2" fill="#94a3b8"/>
      <circle cx="16" cy="68" r="3" fill="#64748b"/><rect x="24" y="65" width="120" height="5" rx="2" fill="#94a3b8"/>
    </g>
    <g id="slideB">
      <rect width="168" height="100" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="12" y="12" width="70" height="10" rx="2" fill="#2563eb"/>
      <rect x="30" y="58" width="18" height="30" fill="#60a5fa"/>
      <rect x="58" y="40" width="18" height="48" fill="#60a5fa"/>
      <rect x="86" y="48" width="18" height="40" fill="#60a5fa"/>
      <rect x="114" y="28" width="18" height="60" fill="#28a05a"/>
      <line x1="22" y1="88" x2="146" y2="88" stroke="#64748b" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="960" height="300" rx="12" fill="#f8fafc"/>
  <text x="24" y="36" font-size="18" font-weight="600" fill="#1f2937">How IdleSlideSnap decides when to save</text>

  <!-- 1: new slide, settled -->
  <g transform="translate(24,60)">
    <use href="#slideA"/>
    <rect y="116" width="168" height="26" rx="13" fill="#28a05a"/>
    <text x="84" y="134" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Saved</text>
    <text x="84" y="164" font-size="13" fill="#475569" text-anchor="middle">slide_0001.png</text>
  </g>

  <!-- 2: only the cursor moved -->
  <g transform="translate(212,60)">
    <use href="#slideA"/>
    <path d="M120 54 l0 18 l5 -5 l4 8 l3 -1.5 l-4 -8 l7 0 z" fill="#111827" stroke="#ffffff" stroke-width="1"/>
    <rect y="116" width="168" height="26" rx="13" fill="#94a3b8"/>
    <text x="84" y="134" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Ignored</text>
    <text x="84" y="164" font-size="13" fill="#475569" text-anchor="middle">Change is too small</text>
  </g>

  <!-- 3: mid-transition -->
  <g transform="translate(400,60)">
    <g opacity="0.5"><use href="#slideA"/></g>
    <g opacity="0.5" transform="translate(10,0)"><use href="#slideB"/></g>
    <rect y="116" width="168" height="26" rx="13" fill="#d08b00"/>
    <text x="84" y="134" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Waiting</text>
    <text x="84" y="164" font-size="13" fill="#475569" text-anchor="middle">Still changing</text>
  </g>

  <!-- 4: next slide, settled -->
  <g transform="translate(588,60)">
    <use href="#slideB"/>
    <rect y="116" width="168" height="26" rx="13" fill="#28a05a"/>
    <text x="84" y="134" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Saved</text>
    <text x="84" y="164" font-size="13" fill="#475569" text-anchor="middle">slide_0002.png</text>
  </g>

  <!-- 5: video playing -->
  <g transform="translate(776,60)">
    <clipPath id="vclip"><rect width="168" height="100" rx="6"/></clipPath>
    <g clip-path="url(#vclip)">
      <rect width="168" height="100" fill="#1e293b"/>
      <circle cx="84" cy="44" r="16" fill="#64748b"/>
      <path d="M48 104 Q48 66 84 66 Q120 66 120 104 Z" fill="#64748b"/>
    </g>
    <path d="M128 34 q8 10 0 20 M136 28 q12 16 0 32" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <rect y="116" width="168" height="26" rx="13" fill="#94a3b8"/>
    <text x="84" y="134" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Skipped</text>
    <text x="84" y="164" font-size="13" fill="#475569" text-anchor="middle">Video never settles</text>
  </g>

  <!-- time axis -->
  <line x1="24" y1="262" x2="930" y2="262" stroke="#94a3b8" stroke-width="2"/>
  <path d="M930 256 l10 6 l-10 6 z" fill="#94a3b8"/>
  <text x="24" y="286" font-size="12" fill="#64748b">time  ·  the screen is checked every 0.7 s</text>
</svg>
